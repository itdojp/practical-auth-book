name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: package-lock.json
        
    - name: Install dependencies
      run: |
        npm ci --omit=optional

    - name: Security audit
      run: |
        npm run check:security

    - name: Check metadata, conflicts, links, images, and anchors
      run: |
        npm test
        npm run build:validate

    - name: Guard legacy src-only content edits
      if: github.event_name == 'pull_request'
      shell: bash
      run: |
        set -euo pipefail

        # `docs/` is the canonical Pages source for this repository.
        # The legacy `npm run build` path regenerates `docs/` from `src/`
        # and can drop current Jekyll route/assets fixes, so PRs must not
        # change source markdown without carrying the matching published docs.
        git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

        src_changes="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'src/**/*.md' || true)"
        docs_changes="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- 'docs/*.md' 'docs/**/*.md' || true)"

        if [ -n "$src_changes" ] && [ -z "$docs_changes" ]; then
          {
            echo "::error::src/ markdown changed without matching docs/ markdown updates."
            echo "Changed src files:"
            echo "$src_changes"
            echo
            echo "Update the corresponding docs/ published files or explain why the src-only change is non-publishing."
          } >&2
          exit 1
        fi
        
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Build book (Jekyll; GitHub Pages compatible)
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./docs
        destination: ./_site
        
    - name: Upload artifact
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      uses: actions/upload-pages-artifact@v5
      with:
        path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
