title: "実践 認証認可システム設計"
description: "認証・認可システムの設計と実装を体系的に学ぶ実践的な技術書"
author: "ITDO Inc.（株式会社アイティードゥ）"
version: "1.0.0"
license: "CC-BY-NC-SA-4.0"
lang: "ja"
url: "https://itdojp.github.io"
baseurl: "/pr-preview/pr-158"
repository: "https://github.com/itdojp/practical-auth-book"
homepage: "https://itdojp.github.io/practical-auth-book/"

# Jekyll設定
markdown: kramdown
highlighter: rouge

# プラグイン
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links
  - jekyll-optional-front-matter
kramdown:
  input: GFM
  syntax_highlighter: rouge

# その他の設定
show_downloads: false
google_analytics:

# ビルド設定
exclude:
  - README.md
  - package.json
  - package-lock.json
  - node_modules/
  - scripts/
  - .gitignore
  - LICENSE
  - CONTRIBUTING.md
  - src/
permalink: pretty
# Use custom book layout as default
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "book"
